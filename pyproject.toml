[project]
name = "this-studio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.12.0",
    "bert-score>=0.3.13",
    "bitsandbytes>=0.49.2",
    "datasets>=4.5.0",
    "faiss-cpu>=1.13.2",
    "huggingface-hub<1",
    "ipykernel>=7.2.0",
    "langgraph>=1.0.9",
    "llama-index>=0.14.15",
    "llama-index-embeddings-huggingface>=0.6.1",
    "llama-index-retrievers-bm25>=0.6.5",
    "llama-index-vector-stores-faiss>=0.5.3",
    "peft>=0.18.0",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.2.3",
    "streamlit>=1.54.0",
    "torch>=2.10.0",
    "transformers>=4.45,<5",
    "trl>=0.23.1",
]

[project.optional-dependencies]
cpu = [
    "faiss-cpu>=1.13.2",
]
gpu = [
    "faiss-gpu-cu12>=1.13.2 ; sys_platform == 'linux'",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
